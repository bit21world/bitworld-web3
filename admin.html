<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitworld — Admin KYC Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{background:#070b14;color:#eef2ff;font-family:Inter,sans-serif;padding:20px;max-width:800px;margin:0 auto}
h1{color:#f5b82e;font-size:22px;margin-bottom:20px}
.card{background:rgba(16,24,42,.8);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.badge{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700}
.badge.pending{background:rgba(245,184,46,.15);color:#f5b82e}
.badge.approved{background:rgba(52,211,153,.15);color:#34d399}
.badge.rejected{background:rgba(248,113,113,.15);color:#f87171}
button{padding:6px 12px;border-radius:6px;font-weight:700;cursor:pointer;border:0}
.btn-ok{background:#34d399;color:#070b14;margin-right:6px}
.btn-no{background:#f87171;color:#fff}
</style>
</head>
<body>
<h1>👑 Bitworld Owner — Verifikasi KYC Member</h1>
<div id="list">Memuat data...</div>

<script>
async function loadKycList() {
  try {
    const r = await fetch('/api/kyc?a=admin_list');
    const data = await r.json();
    const container = document.getElementById('list');
    
    if (!data.ok || !data.list || data.list.length === 0) {
      container.innerHTML = '<p style="color:#8b95b0">Belum ada pengajuan KYC.</p>';
      return;
    }

    container.innerHTML = data.list.map(item => `
      <div class="card">
        <div class="row">
          <strong>Username: @${item.username || 'N/A'}</strong>
          <span class="badge ${item.status}">${item.status.toUpperCase()}</span>
        </div>
        <div style="font-size:13px;color:#8b95b0;margin-bottom:10px">
          Nama Sesuai ID: <b>${item.fullname}</b><br>
          Nomor KTP/ID: <b>${item.id_number}</b><br>
          Waktu Submit: ${new Date(item.created_at).toLocaleString()}
        </div>
        <div>
          <button class="btn-ok" onclick="updateKyc(${item.id}, 'approved')">Setujui (Approve)</button>
          <button class="btn-no" onclick="updateKyc(${item.id}, 'rejected')">Tolak (Reject)</button>
        </div>
      </div>
    `).join('');
  } catch (e) {
    document.getElementById('list').innerHTML = '<p style="color:#f87171">Gagal memuat data dari server.</p>';
  }
}

async function updateKyc(kycId, status) {
  if(!confirm(`Yakin ingin mengubah status KYC ini menjadi ${status}?`)) return;
  const r = await fetch('/api/kyc?a=admin_action', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({kyc_id: kycId, status})
  });
  const res = await r.json();
  if(res.ok) {
    alert('Berhasil diupdate!');
    loadKycList();
  } else {
    alert('Gagal: ' + (res.error || 'Terjadi kesalahan'));
  }
}

loadKycList();
</script>
</body>
</html>
