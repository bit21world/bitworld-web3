<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitworld (BTW) - Mobile Mining</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
        }
        .card {
            background-color: #131a29;
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #1e293b;
            margin-bottom: 15px;
        }
        .title {
            color: #f59e0b;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .wallet-box {
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            color: #38bdf8;
            word-break: break-all;
            margin-bottom: 15px;
        }
        .btn {
            background-color: #d97706;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }
        .btn-green { background-color: #16a34a; }
        .btn-blue { background-color: #0284c7; }
        .btn:active { transform: scale(0.98); }
        
        .input-group {
            text-align: left;
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- DASHBOARD UTAMA (TAMPIL LANGSUNG) -->
        <div id="page-dashboard" class="card">
            <h1 class="title">Bitworld (BTW)</h1>
            <p class="subtitle">Ekosistem Decentralized Mobile Mining</p>
            
            <div id="walletDisplay" class="wallet-box">Status Wallet: Belum Terhubung</div>
            
            <button id="connectBtn" class="btn" onclick="connectWallet()">Hubungkan Dompet MetaMask</button>
            <button class="btn btn-blue" onclick="switchPage('page-mining')">⛏️ Menu Mining BTW</button>
            <button class="btn btn-green" onclick="switchPage('page-profile')">👤 Edit Profil</button>
        </div>

        <!-- MENU MINING -->
        <div id="page-mining" class="card hidden">
            <h1 class="title">Mining BTW</h1>
            <p class="subtitle">Saldo Koin Anda: <b style="color:#f59e0b;" id="coinBalance">0 BTW</b></p>
            
            <button class="btn btn-green" onclick="startMining()">Mulai Mining</button>
            <button class="btn" style="background-color: #334155;" onclick="switchPage('page-dashboard')">Kembali</button>
        </div>

        <!-- MENU EDIT PROFIL -->
        <div id="page-profile" class="card hidden">
            <h1 class="title">Edit Profil</h1>
            
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Masukkan username">
            </div>

            <div class="input-group">
                <label>Bio</label>
                <input type="text" id="userbio" placeholder="Masukkan bio">
            </div>

            <button class="btn btn-green" onclick="saveProfile()">Simpan Profil</button>
            <button class="btn" style="background-color: #334155;" onclick="switchPage('page-dashboard')">Kembali</button>
        </div>

    </div>

    <script>
        let balance = 0;

        function switchPage(pageId) {
            document.getElementById('page-dashboard').classList.add('hidden');
            document.getElementById('page-mining').classList.add('hidden');
            document.getElementById('page-profile').classList.add('hidden');
            document.getElementById(pageId).classList.remove('hidden');
        }

        async function connectWallet() {
            const btn = document.getElementById('connectBtn');
            const display = document.getElementById('walletDisplay');

            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const account = accounts[0];
                    const shortAddr = account.substring(0,6) + "..." + account.substring(account.length-4);
                    
                    display.innerText = "Wallet: " + shortAddr;
                    btn.innerText = "Terhubung";
                    btn.style.backgroundColor = "#16a34a";
                } catch (e) {
                    alert("Koneksi ditolak.");
                }
            } else {
                alert("Mode Web biasa aktif. Buka di aplikasi MetaMask jika ingin menghubungkan wallet asli.");
            }
        }

        function startMining() {
            balance += 10;
            document.getElementById('coinBalance').innerText = balance + " BTW";
            alert("Berhasil klaim 10 BTW!");
        }

        function saveProfile() {
            const name = document.getElementById('username').value;
            alert(name ? "Profil " + name + " tersimpan!" : "Harap isi username!");
            if(name) switchPage('page-dashboard');
        }
    </script>
</body>
</html>
