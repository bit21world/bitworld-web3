<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitworld (BTW)</title>
<style>
:root{--bg:#05070d;--fg:#e8ecf5;--muted:#8a94a8;--accent:#f5b82e;--accent2:#22d3ee;--card:rgba(18,24,38,.72);--line:rgba(255,255,255,.1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{height:100vh;height:100dvh;display:flex;flex-direction:column}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* Header */
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;gap:8px}
.brand{font-weight:800;font-size:17px;color:var(--accent)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--accent);color:#1a1400}

/* Area konten (tanpa scroll) */
main{position:relative;z-index:1;flex:1;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:8px 18px;gap:12px;text-align:center}
.view.active{display:flex;animation:fade .5s var(--spring)}
@keyframes fade{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* Beranda */
h1{font-size:clamp(40px,12vw,80px);font-weight:800;letter-spacing:-1px;line-height:1.05}
.ch{display:inline-block;background:linear-gradient(90deg,var(--accent),#fff3c4,var(--accent));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:drop .9s var(--spring) both,shine 4s linear infinite;animation-delay:calc(var(--i) * 70ms + 100ms),0s}
@keyframes drop{from{opacity:0;transform:translateY(-120%) scale(.4)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:200% center}}
.badge{display:inline-block;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--accent2);background:rgba(34,211,238,.08);letter-spacing:.6px}
.tagline{font-size:clamp(13px,3.4vw,16px);color:var(--muted);max-width:420px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:460px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card .label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.card .value{font-size:clamp(14px,4vw,18px);font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-word}
.gold{color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* Tombol umum */
.btn{display:inline-block;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;transition:transform .4s var(--spring),border-color .3s,color .3s;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1400}
.btn:hover{border-color:var(--accent2);color:var(--accent2);transform:translateY(-2px)}
.btn.primary:hover{color:#1a1400;border-color:var(--accent)}
.btn:active{transform:scale(.93)}
.btn:disabled{opacity:.35;cursor:default;transform:none}

/* Panel isi */
.panel{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.panel h2{font-size:clamp(18px,4.6vw,22px);margin-bottom:8px;color:var(--accent)}
.panel p{font-size:13.5px;line-height:1.6;color:var(--fg);opacity:.92;margin-bottom:8px}
.panel p:last-child{margin-bottom:0}
.muted{color:var(--muted)!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--accent2);word-break:break-all;background:rgba(0,0,0,.3);padding:8px;border-radius:8px;margin:8px 0}

/* Whitepaper: menu bagian */
.wpmenu{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%;max-width:520px}
.wpmenu button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:all .3s var(--spring)}
.wpmenu button.on{background:var(--accent2);border-color:var(--accent2);color:#021318;font-weight:700;transform:scale(1.05)}
.wpnav{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px;gap:8px}
.wpnav span{font-size:12px;color:var(--muted)}

/* Tabel token */
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--muted);width:38%}

/* Visi & misi */
.list{padding-left:18px;font-size:13.5px;line-height:1.6}
.list li{margin-bottom:6px}

/* Ticker dan navigasi bawah */
.ticker{position:relative;z-index:2;overflow:hidden;border-top:1px solid var(--line);background:rgba(255,255,255,.03);padding:8px 0;flex-shrink:0}
.track{display:flex;width:max-content;animation:marquee 20s linear infinite}
.track span{padding:0 20px;font-size:11.5px;font-weight:700;letter-spacing:.8px;color:var(--muted);white-space:nowrap}
.track span b{color:var(--accent)}
@keyframes marquee{to{transform:translateX(-50%)}}
nav.bottom{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;border-bottom:1px solid var(--line);flex-shrink:0;padding:0 4px;}
nav.bottom::-webkit-scrollbar{display:none}
nav.bottom button{background:transparent;border:0;color:var(--muted);padding:10px 8px;min-height:44px;font-size:12px;font-weight:700;white-space:nowrap;flex:0 0 auto;cursor:pointer;font-family:inherit;transition:color .3s,transform .4s var(--spring);}
nav.bottom button.locked{color:#6b7389}
nav.bottom button.on{color:var(--accent)}
.lockcard{width:100%;max-width:460px;border:1px dashed rgba(245,184,46,.45);border-radius:14px;padding:12px;background:rgba(245,184,46,.05);text-align:left}
.lockcard .t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--accent)}
.lockcard p{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
.lockcard .badge2{margin-left:auto;font-size:10px;letter-spacing:1px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
@media (max-width:360px){nav.bottom button{font-size:11px;padding:14px 2px}}
nav.bottom button:active{transform:scale(.9)}

#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(120px) scale(.8);background:#fff;color:#000;padding:8px 16px;border-radius:10px;font-size:13px;transition:transform .6s var(--spring);z-index:9;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0) scale(1)}

@media (max-height:640px){ .badge,.warnhome{display:none} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>

<style id="tema-biru-3d">
:root{--bg:#06163a;--card:rgba(16,42,100,.55);--line:rgba(120,170,255,.22)}
html,body{background-color:#051537;background-image:radial-gradient(ellipse at 50% -10%,#2563eb 0%,#1e40af 28%,#0b2a6b 62%,#051537 100%);background-attachment:fixed}
.ticker{background:rgba(10,40,110,.65)!important;border-top:1px solid rgba(120,170,255,.3)!important}
header{background:transparent}
.card,.panel,.contract,.lockcard{background:linear-gradient(160deg,rgba(59,130,246,.28),rgba(12,32,90,.82))!important;border:1px solid rgba(147,197,253,.22)!important;box-shadow:0 7px 0 rgba(3,12,40,.85),0 16px 28px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2)!important;border-radius:16px!important}
.card{transform:perspective(700px) rotateX(5deg)}
.card:hover{transform:perspective(700px) rotateX(0deg) translateY(-3px)}
nav.bottom{background:linear-gradient(180deg,#1d4ed8,#0b2a6b)!important;box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);border-bottom:none!important;padding:6px 6px 8px!important;gap:4px}
nav.bottom button{background:linear-gradient(180deg,#3b72ea,#1d4aa8)!important;color:#e0ecff!important;border-radius:12px!important;margin:2px;box-shadow:0 5px 0 #0a1f5c,0 9px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.32)!important;transition:transform .15s,box-shadow .15s!important}
nav.bottom button:active{transform:translateY(4px)!important;box-shadow:0 1px 0 #0a1f5c,0 3px 6px rgba(0,0,0,.45)!important}
nav.bottom button.on{background:linear-gradient(180deg,#fde68a,#f5b82e)!important;color:#1a1400!important;box-shadow:0 5px 0 #a16207,0 12px 20px rgba(245,184,46,.4),inset 0 1px 0 rgba(255,255,255,.7)!important}
nav.bottom button.locked{background:linear-gradient(180deg,#475569,#1e293b)!important;color:#cbd5e1!important;box-shadow:0 5px 0 #0f172a,0 9px 14px rgba(0,0,0,.4)!important}
.btn{box-shadow:0 5px 0 #1e3a8a,0 10px 18px rgba(0,0,0,.4)!important;border-radius:12px!important;border:1px solid rgba(147,197,253,.35)!important;background:linear-gradient(180deg,rgba(59,130,246,.35),rgba(20,50,130,.7))!important;color:#e0ecff!important}
.btn.primary{background:linear-gradient(180deg,#fde68a,#f5b82e)!important;color:#1a1400!important;border-color:#f5b82e!important;box-shadow:0 5px 0 #a16207,0 12px 20px rgba(245,184,46,.35)!important}
.btn:active{transform:translateY(4px)!important;box-shadow:0 1px 0 #1e3a8a!important}
.btn.primary:active{box-shadow:0 1px 0 #a16207!important}
.wpmenu button{background:linear-gradient(180deg,#2b5bd6,#1a3f9e)!important;color:#dbe7ff!important;border:none!important;border-radius:999px!important;box-shadow:0 4px 0 #0a1f5c,0 8px 14px rgba(0,0,0,.35)!important;padding:7px 12px!important}
.wpmenu button.on{background:linear-gradient(180deg,#67e8f9,#22d3ee)!important;color:#021318!important;box-shadow:0 4px 0 #0e7490,0 10px 16px rgba(34,211,238,.35)!important}
.wpmenu button:active{transform:translateY(3px)!important}
.stats .card .value{text-shadow:0 2px 0 rgba(0,0,0,.35)}
</style>

<style id="auth-mining">
.hright{display:flex;align-items:center;gap:8px}
.accbtn{border:0;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer;color:#1a1400;background:linear-gradient(180deg,#fde68a,#f5b82e);box-shadow:0 3px 0 #a16207}
.accbtn:active{transform:translateY(3px);box-shadow:none}
.fm h2{font-size:20px;color:var(--accent);margin-bottom:4px}
.fm .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.fm label{display:block;font-size:12px;margin:12px 0 5px;color:#cdd8ff}
.fm input{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font-size:16px}
.fm input:focus{outline:2px solid var(--accent)}
.fm .btn{width:100%;margin-top:16px;text-align:center}
.fm .btn:disabled{opacity:.55}
.tabs2{display:flex;gap:6px;margin-bottom:8px}
.tabs2 button{flex:1;padding:9px;border:0;border-radius:10px;font-weight:700;cursor:pointer;color:#dbe7ff;background:rgba(255,255,255,.08)}
.tabs2 button.on{background:var(--accent);color:#1a1400}
.fmsg{margin-top:12px;padding:9px 11px;border-radius:10px;font-size:13px;display:none}
.fmsg.err{display:block;background:rgba(239,68,68,.22);color:#fecaca}
.fmsg.ok{display:block;background:rgba(34,197,94,.22);color:#bbf7d0}
.lnk{margin-top:12px;text-align:center;font-size:13px}
.lnk a{color:var(--accent);cursor:pointer}
.bal{text-align:center;margin:10px 0 4px}
.bal .n{font-size:44px;font-weight:800;color:var(--accent)}
.bal .u{font-size:12px;color:var(--muted);letter-spacing:2px}
.mst{display:flex;gap:8px;margin:10px 0}
.mst div{flex:1;text-align:center;padding:9px;border-radius:12px;background:rgba(255,255,255,.07);font-size:12px;color:var(--muted)}
.mst b{display:block;font-size:16px;color:#fff;margin-top:2px}
.note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5}
</style>

<style id="dapp-theme">
/* ===== Tema dApp: gelap, rata, minimalis ===== */
html:root{--bg:#0b0e14;--fg:#e8ebf2;--muted:#8a93a6;--accent:#f0b90b;--accent2:#6ea8ff;--card:#121823;--line:rgba(255,255,255,.08);--surface2:#1a2233}
html body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif!important;background-color:#0b0e14!important;background-image:radial-gradient(900px 420px at 50% -140px,rgba(240,185,11,.08),transparent 70%)!important;background-attachment:fixed}
html body::before,html #scene,html .ticker{display:none!important}
html header{background:rgba(11,14,20,.94);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px}
html .brand{display:flex;align-items:center;gap:8px;color:#fff;font-size:17px;font-weight:700;letter-spacing:-.2px}
html .brand img{border-radius:6px}
html .accbtn{background:var(--accent)!important;color:#111!important;box-shadow:none!important;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700}
html .accbtn:active{transform:scale(.97)}
html .lang{border-radius:10px;border:1px solid var(--line)}
html .lang button{padding:7px 11px;font-weight:600}
html .lang button.on{background:var(--surface2);color:#fff}
/* menu: tab horizontal */
html nav.bottom{display:flex!important;flex-wrap:nowrap!important;justify-content:flex-start!important;overflow-x:auto;gap:0!important;padding:0 8px!important;background:rgba(11,14,20,.94)!important;border-bottom:1px solid var(--line)!important;box-shadow:none!important;scrollbar-width:none;-webkit-overflow-scrolling:touch}
html nav.bottom::-webkit-scrollbar{display:none}
html nav.bottom button{background:transparent!important;box-shadow:none!important;border-radius:0!important;margin:0!important;color:var(--muted)!important;font-size:13.5px;font-weight:600;padding:12px 12px!important;border-bottom:2px solid transparent;transition:color .2s!important}
html nav.bottom button.on,html nav.bottom button.locked{background:transparent!important;box-shadow:none!important}
html nav.bottom button.on{color:#fff!important;border-bottom-color:var(--accent)}
html nav.bottom button.locked{color:#586177!important}
html nav.bottom button:active{transform:none!important;box-shadow:none!important}
/* kartu & panel */

function toast(msg){

  });

  var s = WP[wpIndex], body = "";
  body += "<h2>" + esc(s.t[lang]) + "</h2>";
  if (s.table) {
    var rows = lang === "id"
      ? [["Nama","Bitworld"],["Simbol","BTW"],["Standar","BEP-20"],["Jaringan","BNB Smart Chain (BSC)"],["Total supply","21.000.000 BTW"],["Smart contract",CONTRACT]]

    (s.b[lang] || []).forEach(function(p){ body += "<p>" + esc(p) + "</p>"; });

function renderExtra(){

    {n: isId ? "Whitepaper (PDF)" : "Whitepaper (PDF)", u: "whitepaper-bitworld-btw-publik.pdf"},

  ];

    d += "<p style='margin-bottom:8px'><a href='" + f.u + "' download style='color:var(--accent);font-weight:700'>" + esc(f.n) + "</a></p>";

  d += "<h2 style='margin-top:12px;font-size:16px'>" + (isId ? "Cek kontrak sendiri" : "Check the contract yourself") + "</h2>";

    "Buka BscScan dan tempel alamat kontrak resmi.",
    "Cocokkan alamatnya dengan yang tertulis di website ini.",
    "Buka tab Contract, lalu cek apakah Source Code sudah terverifikasi.",
    "Cek supply dan fungsi kontrak. Tidak ada fungsi mint, burn, atau pause."
  ] : [
    "Open BscScan and paste the official contract address.",
    "Match the address with the one written on this website.",
    "Open the Contract tab and check that the Source Code is verified.",
    "Check the supply and contract functions. There are no mint, burn, or pause functions."
  ];
  d += "<p class='muted' style='font-size:12.5px;line-height:1.6'>" + steps.map(function(s,i){ return (i+1) + ". " + esc(s); }).join("<br>") + "</p>";

  var s = "<h2>" + (isId ? "Keamanan" : "Security") + "</h2>";
  var warn = isId ? [
    "Tim BTW tidak pernah meminta seed phrase, private key, atau pembayaran.",
    "Tidak ada janji harga, keuntungan, atau hasil tetap.",
    "Waspadai akun yang menghubungi Anda lebih dulu, termasuk yang mengaku admin.",

  ];

      : "This website only records anonymous visit counts through Vercel Web Analytics. No cookies, no accounts, and no personal data are collected.") + "</p>";

  var r = "<h2>Roadmap</h2>";

/* Angka supply dengan easing elastis */
(function(){
  var out = $("supply");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var target = 21000000, dur = 2000;
  var elastic = function(t){ return t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(2*Math.PI/3))+1; };
  var start = performance.now();
  out.textContent = "0";
  (function step(now){
    var p = Math.min((now-start)/dur, 1);
    out.textContent = Math.round(elastic(p)*target).toLocaleString("id-ID");
    if (p < 1) requestAnimationFrame(step); else out.textContent = target.toLocaleString("id-ID");
  })(start);
})();

(function(){
  var canvas = $("scene");
  if (typeof THREE === "undefined") { canvas.style.display = "none"; return; }
  try {
    var renderer = new THREE.WebGLRenderer({canvas:canvas, antialias:true, alpha:true});
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    camera.position.z = 6;
    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    var key = new THREE.DirectionalLight(0xfff3c4, 1.2); key.position.set(3,4,5); scene.add(key);
    var rim = new THREE.DirectionalLight(0x22d3ee, 0.8); rim.position.set(-4,-2,-3); scene.add(rim);
    var goldMat = new THREE.MeshStandardMaterial({color:0xf5b82e, metalness:1, roughness:0.25});
    var edgeMat = new THREE.MeshStandardMaterial({color:0xffe08a, metalness:1, roughness:0.15});
    var coin = new THREE.Group();
    var body = new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.4,0.18,64), goldMat);
    body.rotation.x = Math.PI/2; coin.add(body);
    coin.add(new THREE.Mesh(new THREE.TorusGeometry(1.38,0.07,16,96), edgeMat));
    coin.add(new THREE.Mesh(new THREE.TorusGeometry(0.9,0.035,12,80), edgeMat));
    coin.position.y = 1.2; scene.add(coin);
    var orbit = new THREE.Group(); orbit.position.y = 1.2; scene.add(orbit);
    var nodeGeo = new THREE.IcosahedronGeometry(0.12,1);
    var nodeMat = new THREE.MeshStandardMaterial({color:0x22d3ee, emissive:0x0e7490, roughness:0.4});
    var nodes = [];
    for (var i=0;i<6;i++){
      var n = new THREE.Mesh(nodeGeo, nodeMat);
      n.userData = {angle:(i/6)*Math.PI*2, r:2.6+(i%2)*0.5, speed:0.25+i*0.03, tilt:(i%3-1)*0.4};
      orbit.add(n); nodes.push(n);
    }
    var count = 700, pos = new Float32Array(count*3);
    for (var j=0;j<count;j++){ pos[j*3]=(Math.random()-0.5)*14; pos[j*3+1]=(Math.random()-0.5)*14; pos[j*3+2]=(Math.random()-0.5)*8-2; }
    var sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.BufferAttribute(pos,3));
    var stars = new THREE.Points(sg, new THREE.PointsMaterial({color:0xffffff,size:0.025,transparent:true,opacity:0.6}));
    scene.add(stars);
    function resize(){
      var w = innerWidth, h = innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w/h; camera.position.z = w < 600 ? 8 : 6; camera.updateProjectionMatrix();
    }
    addEventListener("resize", resize); resize();
    var clock = new THREE.Clock();
    (function animate(){
      var t = clock.getElapsedTime();
      coin.rotation.y = t*0.6;
      coin.rotation.x = Math.sin(t*0.8)*0.15;
      orbit.rotation.z = t*0.05;
      stars.rotation.y = t*0.02;
      nodes.forEach(function(n){
        var u = n.userData, a = u.angle + t*u.speed;
        n.position.set(Math.cos(a)*u.r, Math.sin(a)*u.r*0.35 + Math.sin(a*2)*u.tilt, Math.sin(a)*u.r*0.5);
      });
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    })();
  } catch(err) {
    console.warn("3D tidak bisa ditampilkan:", err);
    canvas.style.display = "none";
  }
})();

    var m = g("fmsg"); if (!m) return;
    var a = document.createElement("a");
    a.textContent = T("Kirim ulang email verifikasi", "Resend verification email");
    a.style.cssText = "color:#fde68a;cursor:pointer;text-decoration:underline;display:block;margin-top:6px";
    a.onclick = function(){
      api("resend", { email: em }).then(function(r){
        msg(r.ok ? T("Email verifikasi dikirim ulang. Cek inbox/spam.", "Verification email resent. Check inbox/spam.") : errText(r.data.error), r.ok);
      });
    };
    m.appendChild(a);
  }
  function doLogin(e){
    e.preventDefault();
    var em = g("fEmail").value.trim();
    g("fBtn").disabled = true;
    api("login", { email: em, password: g("fPass").value }).then(function(r){
      if (g("fBtn")) g("fBtn").disabled = false;
      if (!r.ok) { msg(errText(r.data.error)); if (r.data.error === "not_verified") addResend(em); return; }
      return loadMe().then(function(){ refreshAll(); go("home"); });
    });
  }
  function doForgot(e){
    e.preventDefault();
    var em = g("fEmail").value.trim();
    if (!em) return msg(T("Isi email Anda dulu.", "Enter your email first."));
    g("fBtn").disabled = true;
    api("forgot", { email: em }).then(function(r){
      if (g("fBtn")) g("fBtn").disabled = false;
      if (!r.ok) return msg(errText(r.data.error));
      msg(T("Jika email terdaftar, link reset sudah dikirim. Cek inbox/spam.", "If the email is registered, a reset link has been sent. Check inbox/spam."), true);
    });
  }
  function doReset(e){
    e.preventDefault();
    var p = g("fPass").value;
    if (p.length < 8) return msg(errText("weak_password"));
    if (p !== g("fPass2").value) return msg(T("Konfirmasi password tidak sama.", "Passwords do not match."));
    g("fBtn").disabled = true;
    api("reset", { token: resetToken, password: p }).then(function(r){
      if (g("fBtn")) g("fBtn").disabled = false;
      if (!r.ok) return msg(errText(r.data.error));
      resetToken = null; user = null; mode = "login"; refreshAll();
      msg(T("Password berhasil diganti. Silakan masuk.", "Password changed. Please log in."), true);
    });
  }

  /* ---------- MINING ---------- */
  function renderMine(){
    var b = g("mineBody"); if (!b) return;
    clearInterval(tick);
    if (!user) { b.innerHTML = '<h2>Mining</h2><p class="sub">' + T("Masuk dulu untuk mulai mining.", "Log in to start mining.") +
      '</p><button class="btn primary" type="button" id="mGo">' + T("Masuk / Daftar", "Log in / Sign up") + '</button>';
      g("mGo").onclick = function(){ go("auth"); }; return; }
    var RATE = user.rate || 0.004, DUR = (user.session_hours || 24) * 3600 * 1000;
    var skew = user.server_now ? new Date(user.server_now).getTime() - Date.now() : 0;
    var start = user.mine_start ? new Date(user.mine_start).getTime() : 0;
    b.innerHTML = '<h2>Mining</h2><p class="sub">' + T("Mulai sesi mining 24 jam, poin bertambah setiap jam.", "Start a 24-hour mining session, points grow every hour.") + '</p>' +
      '<div class="bal"><div class="n" id="mBal">0</div><div class="u">' + T("POIN BTW (INTERNAL)", "BTW POINTS (INTERNAL)") + '</div></div>' +
      '<div class="mst"><div>Rate<b>' + String(RATE).replace(".", ",") + ' / ' + T("jam", "hr") + '</b></div>' +
      '<div>Status<b id="mStat">-</b></div></div>' +
      '<button class="btn primary" type="button" id="mBtn" disabled>-</button><div class="fmsg" id="fmsg"></div>';
    g("mBtn").onclick = claim;
    function upd(){
      var btn = g("mBtn"); if (!btn) return clearInterval(tick);
      var now = Date.now() + skew;
      var elapsed = start ? Math.max(0, Math.min(now - start, DUR)) : 0;
      var total = user.balance + RATE * (elapsed / 3600000);
      g("mBal").textContent = total.toLocaleString("id-ID", { minimumFractionDigits: 6, maximumFractionDigits: 6 });
      var left = start ? start + DUR - now : 0;
      if (start && left > 0) {
        var s = Math.ceil(left / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), c = s % 60;
        btn.disabled = true; btn.textContent = [h, m, c].map(function(x){ return String(x).padStart(2, "0"); }).join(":");
        g("mStat").textContent = T("Mining", "Mining");
      } else {
        btn.disabled = false;
        btn.textContent = start ? T("Mulai Sesi Baru", "Start New Session") : T("Mulai Mining", "Start Mining");
        g("mStat").textContent = start ? T("Selesai", "Done") : T("Siap", "Ready");
      }
    }
    upd(); tick = setInterval(upd, 1000);
  }
  function claim(){
    g("mBtn").disabled = true;
    api("claim", {}).then(function(r){
      loadMe().then(function(){
        renderMine();
        if (r.ok) msg(T("Sesi mining 24 jam dimulai!", "24-hour mining session started!"), true);
        else msg(errText(r.data.error));
      });
    });
  }

  /* ---------- tombol akun, gate, sinkron status ---------- */
  function updAcc(){
    var b = g("acc-btn"); if (!b) return;
    b.textContent = user ? T("Akun", "Account") : T("Masuk", "Log in");
  }
  function refreshAll(){ updAcc(); renderAuth(); renderMine(); }

  g("acc-btn").addEventListener("click", function(){ go("auth"); });
  ["lang-id", "lang-en"].forEach(function(id){ g(id).addEventListener("click", refreshAll); });

  var _go = go;
  go = function(n){
    if (n === "mine" && !user) { toast(T("Masuk dulu untuk mining", "Log in to mine")); n = "auth"; }
    _go(n);
    var ab = document.querySelector("nav.bottom button.on");
    if (ab && ab.scrollIntoView) ab.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
    if (n === "mine") loadMe().then(renderMine);
  };

  var qs = new URLSearchParams(location.search), vt = qs.get("verify"), rt = qs.get("reset");
  if (vt || rt) history.replaceState(null, "", location.pathname + location.hash);
  refreshAll();
  loadMe().then(function(){
    refreshAll();
    if (vt) {
      return api("verify", { token: vt }).then(function(r){
        if (r.ok) return loadMe().then(function(){ refreshAll(); go("home"); toast(T("Email terverifikasi!", "Email verified!")); });
        go("auth"); msg(errText(r.data.error || "token_invalid"));
      });
    }
    if (rt) { resetToken = rt; mode = "reset"; refreshAll(); go("auth"); return; }
    if (!user && location.hash === "#mine") go("auth");
  });
})();
</script>
<script src="/profil.js"></script><script src="/captcha.js"></script></body>
</html>
