<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitworld (BTW) — Layer 2 BNB Smart Chain</title>
<style>
:root {
  --bg-dark: #070e26;
  --bg-card: #0d1b3e;
  --border: #1e3a78;
  --gold-primary: #f5d27d;
  --gold-secondary: #a56e19;
  --text-main: #f0f4fc;
  --text-muted: #8ca3d4;
  --blue-btn: #1b387a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--bg-dark);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px;
  background: rgba(13, 27, 62, 0.8);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo-title {
  font-size: 20px;
  font-weight: 900;
  color: var(--gold-primary);
  letter-spacing: 1px;
}
.lang-btn {
  background: var(--blue-btn);
  color: #fff;
  border: 1px solid var(--border);
  padding: 6px 14px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}
main {
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 16px;
  width: 100%;
  flex: 1;
}

/* TOMBOL MINING DI ATAS */
.mining-banner-top {
  text-align: center;
  margin: 10px 0 25px 0;
}
.btn-mining-gold {
  background: linear-gradient(135deg, var(--gold-primary), var(--gold-secondary));
  color: #17140b;
  padding: 14px 28px;
  border-radius: 14px;
  font-weight: 900;
  text-decoration: none;
  display: inline-block;
  font-size: 16px;
  box-shadow: 0 4px 20px rgba(245, 210, 125, 0.3);
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn-mining-gold:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 25px rgba(245, 210, 125, 0.4);
}

.hero {
  text-align: center;
  padding: 20px 0;
}
.badge-bsc {
  display: inline-block;
  background: rgba(30, 58, 120, 0.5);
  border: 1px solid var(--border);
  color: var(--gold-primary);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 12px;
}
h1.title {
  font-size: clamp(36px, 6vw, 52px);
  color: var(--gold-primary);
  font-weight: 900;
  margin-bottom: 10px;
}
p.subtitle {
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.6;
  max-width: 600px;
  margin: 0 auto 24px auto;
}
.grid-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.card-stat {
  background: var(--bg-card);
  border: 1px solid var(--border);
  padding: 16px;
  border-radius: 14px;
  text-align: center;
}
.card-stat span {
  display: block;
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 4px;
}
.card-stat b {
  font-size: 18px;
  color: var(--gold-primary);
}
.actions {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 30px;
}
.btn-action {
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: 700;
  text-decoration: none;
  font-size: 14px;
}
.btn-primary { background: var(--gold-primary); color: #111; }
.btn-secondary { background: var(--blue-btn); color: #fff; border: 1px solid var(--border); }

footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
}
@media(max-width:600px){
  .grid-stats { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="logo-title">BTW</div>
  <button class="lang-btn" id="btnLang">ID | EN</button>
</header>

<main>

  <!-- 1. TOMBOL AKSES MINING (POSISI ATAS UTAMA) -->
  <div class="mining-banner-top">
    <a href="BTW_Mining.html" class="btn-mining-gold">
      ⚡ MASUK KE HALAMAN MINING BTW
    </a>
  </div>

  <!-- 2. JUDUL UTAMA BITWORLD -->
  <div class="hero">
    <div class="badge-bsc">BEP-20 • BNB SMART CHAIN</div>
    <h1 class="title">Bitworld</h1>
    <p class="subtitle">
      Proyek Layer 2 di jaringan BSC dengan token BTW. Pelajari visi, whitepaper, dan kontrak Bitworld.
    </p>

    <div class="grid-stats">
      <div class="card-stat"><span>Simbol</span><b>BTW</b></div>
      <div class="card-stat"><span>Supply</span><b>21.000.000</b></div>
      <div class="card-stat"><span>Jaringan</span><b>BSC</b></div>
    </div>

    <div class="actions">
      <a href="whitepaper-bitworld-btw-publik.pdf" target="_blank" class="btn-action btn-primary">Baca Whitepaper</a>
      <a href="https://bscscan.com/token/0x9c8a29b9b9866464bb34aae32fd94a1594b1f3ea" target="_blank" class="btn-action btn-secondary">Lihat Kontrak</a>
    </div>
  </div>

</main>

<footer>
  <p>Bukan ajakan investasi. DYOR.</p>
</footer>

<script src="auth.js"></script>
</body>
</html>
