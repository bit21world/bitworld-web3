
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitworld (BTW)</title>
<style>
:root{--bg:#05070d;--fg:#e8ecf5;--muted:#8a94a8;--accent:#f5b82e;--accent2:#22d3ee;--card:rgba(18,24,38,.72);--line:rgba(255,255,255,.1);--spring:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{height:100vh;height:100dvh;display:flex;flex-direction:column}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;gap:8px}
.brand{font-weight:800;font-size:17px;color:var(--accent)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--accent);color:#1a1400}
main{position:relative;z-index:1;flex:1;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:8px 18px;gap:12px;text-align:center}
.view.active{display:flex;animation:fade .5s var(--spring)}
@keyframes fade{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
h1{font-size:clamp(40px,12vw,80px);font-weight:800;letter-spacing:-1px;line-height:1.05}
.ch{display:inline-block;background:linear-gradient(90deg,var(--accent),#fff3c4,var(--accent));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:drop .9s var(--spring) both,shine 4s linear infinite;animation-delay:calc(var(--i) * 70ms + 100ms),0s}
@keyframes drop{from{opacity:0;transform:translateY(-120%) scale(.4)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:200% center}}
.badge{display:inline-block;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--accent2);background:rgba(34,211,238,.08);letter-spacing:.6px}
.tagline{font-size:clamp(13px,3.4vw,16px);color:var(--muted);max-width:420px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:460px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card .label{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
.card .value{font-size:clamp(14px,4vw,18px);font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-word}
.gold{color:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;transition:transform .4s var(--spring),border-color .3s,color .3s;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1400}
.btn:hover{border-color:var(--accent2);color:var(--accent2);transform:translateY(-2px)}
.btn.primary:hover{color:#1a1400;border-color:var(--accent)}
.btn:active{transform:scale(.93)}
.btn:disabled{opacity:.35;cursor:default;transform:none}
.panel{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.panel h2{font-size:clamp(18px,4.6vw,22px);margin-bottom:8px;color:var(--accent)}
.panel p{font-size:13.5px;line-height:1.6;color:var(--fg);opacity:.92;margin-bottom:8px}
.panel p:last-child{margin-bottom:0}
.muted{color:var(--muted)!important}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:var(--accent2);word-break:break-all;background:rgba(0,0,0,.3);padding:8px;border-radius:8px;margin:8px 0}
.wpmenu{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%;max-width:520px}
.wpmenu button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:5px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;transition:all .3s var(--spring)}
.wpmenu button.on{background:var(--accent2);border-color:var(--accent2);color:#021318;font-weight:700;transform:scale(1.05)}
.wpnav{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px;gap:8px}
.wpnav span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--muted);width:38%}
.list{padding-left:18px;font-size:13.5px;line-height:1.6}
.list li{margin-bottom:6px}
.ticker{position:relative;z-index:2;overflow:hidden;border-top:1px solid var(--line);background:rgba(255,255,255,.03);padding:8px 0;flex-shrink:0}
.track{display:flex;width:max-content;animation:marquee 20s linear infinite}
.track span{padding:0 20px;font-size:11.5px;font-weight:700;letter-spacing:.8px;color:var(--muted);white-space:nowrap}
.track span b{color:var(--accent)}
@keyframes marquee{to{transform:translateX(-50%)}}
nav.bottom{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;border-bottom:1px solid var(--line);flex-shrink:0;padding:0 4px}
nav.bottom button{background:transparent;border:0;color:var(--muted);padding:10px 8px;min-height:44px;font-size:12px;font-weight:700;white-space:nowrap;flex:0 0 auto;cursor:pointer;font-family:inherit;transition:color .3s,transform .4s var(--spring)}
nav.bottom button.locked{color:#6b7389}
nav.bottom button.on{color:var(--accent)}
nav.bottom button:active{transform:scale(.9)}
.lockcard{width:100%;max-width:460px;border:1px dashed rgba(245,184,46,.45);border-radius:14px;padding:12px;background:rgba(245,184,46,.05);text-align:left}
.badge2{font-size:10px;letter-spacing:1px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(120px) scale(.8);background:#fff;color:#000;padding:8px 16px;border-radius:10px;font-size:13px;transition:transform .6s var(--spring);z-index:9;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0) scale(1)}

/* MODAL / POPUP ACCOUNT & KYC */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(5px);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.active{display:flex}
.modal-card{width:100%;max-width:400px;background:linear-gradient(160deg,rgba(16,42,100,0.95),rgba(6,22,58,0.98));border:1px solid rgba(147,197,253,0.3);border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.8);color:var(--fg);text-align:left}
.modal-card h3{margin-bottom:12px;color:var(--accent);font-size:18px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.form-group input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,0.4);color:#fff;font-family:inherit;font-size:13px}
.status-badge{display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:bold;margin-bottom:12px}
.status-unverified{background:rgba(239,68,68,0.2);color:#ef4444;border:1px solid #ef4444}
.status-pending{background:rgba(234,179,8,0.2);color:#eab308;border:1px solid #eab308}
.status-verified{background:rgba(34,197,94,0.2);color:#22c55e;border:1px solid #22c55e}

@media (max-width:360px){nav.bottom button{font-size:11px;padding:14px 2px}}
@media (max-height:640px){ .badge,.warnhome{display:none} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
