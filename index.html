<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitworld Web3 dApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header / Navbar -->
    <header class="w-full max-w-4xl flex justify-between items-center py-4 border-b border-slate-800 mb-8">
        <h1 class="text-2xl font-bold text-amber-400">Bitworld</h1>
        <div id="authHeader" class="flex gap-2">
            <button onclick="openAuthModal('login')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-amber-400 font-bold px-4 py-2 rounded-lg transition">
                Masuk
            </button>
            <button onclick="openAuthModal('register')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg transition">
                Daftar
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-4xl text-center space-y-6">
        <h2 class="text-4xl font-extrabold text-amber-400">Bitworld</h2>
        <p class="text-slate-400 max-w-lg mx-auto">
            Proyek Layer-2 di jaringan BSC dengan ekosistem Web3 dan integrasi modul KYC aman.
        </p>

        <!-- Dynamic User Status Card -->
        <div id="userCard" class="hidden bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-md mx-auto text-left space-y-4">
            <div class="flex justify-between items-center">
                <span class="text-slate-400">Selamat datang,</span>
                <span id="displayUsername" class="font-bold text-amber-400 text-lg"></span>
            </div>
        </div>
    </main>

    <!-- MODAL AUTH (LOGIN & DAFTAR) -->
    <div id="authModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 relative space-y-4">
            <button onclick="closeModal('authModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white">&times;</button>

            <div class="flex border-b border-slate-700 pb-2 gap-4">
                <button id="tabLogin" onclick="switchAuthMode('login')" class="text-lg font-bold text-amber-400 border-b-2 border-amber-400 pb-1">Masuk</button>
                <button id="tabRegister" onclick="switchAuthMode('register')" class="text-lg font-bold text-slate-400 hover:text-white pb-1">Daftar Akun</button>
            </div>

            <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Username</label>
                    <input type="text" id="authUsername" required autocapitalize="none" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password (min. 8 karakter)</label>
                    <input type="password" id="authPassword" required minlength="8" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
                </div>
                <button type="submit" id="btnAuthSubmit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition">Masuk</button>
            </form>
        </div>
    </div>

    <script>
        let currentMode = 'login';
        const $ = (id) => document.getElementById(id);

        const AUTH_ERR = {
            bad_credentials: 'Username atau password salah.',
            username_taken: 'Username sudah dipakai.',
            username_invalid: 'Username harus 3-24 karakter: huruf, angka, _ . -',
            password_short: 'Password minimal 8 karakter.'
        };
        function openModal(id) { $(id).classList.remove('hidden'); }
        function closeModal(id) { $(id).classList.add('hidden'); }

        function openAuthModal(mode) { switchAuthMode(mode); openModal('authModal'); }

        function switchAuthMode(mode) {
            currentMode = mode;
            if (mode === 'login') {
                $('tabLogin').className = "text-lg font-bold text-amber-400 border-b-2 border-amber-400 pb-1";
                $('tabRegister').className = "text-lg font-bold text-slate-400 hover:text-white pb-1";
                $('btnAuthSubmit').innerText = "Masuk";
            } else {
                $('tabRegister').className = "text-lg font-bold text-amber-400 border-b-2 border-amber-400 pb-1";
                $('tabLogin').className = "text-lg font-bold text-slate-400 hover:text-white pb-1";
                $('btnAuthSubmit').innerText = "Daftar Akun Baru";
            }
        }

        /* ---------- Tampilan setelah login ---------- */
        function showLoggedIn(username) {
            $('userCard').classList.remove('hidden');
            $('displayUsername').textContent = username;
            const span = document.createElement('span');
            span.className = 'text-amber-400 font-bold';
            span.textContent = username;
            $('authHeader').replaceChildren(span);
        }

        async function restoreSession() {
            try {
                const r = await fetch('/api?a=me', { credentials: 'same-origin' });
                if (!r.ok) return;
                const d = await r.json();
                if (d && d.user) showLoggedIn(d.user.username);
            } catch (e) { console.error('restoreSession:', e); }
        }

        /* ---------- Login / daftar ---------- */
        async function handleAuthSubmit(e) {
            e.preventDefault();
            const btn = $('btnAuthSubmit');
            const originalText = btn.innerText;
            btn.innerText = 'Memproses...';
            btn.disabled = true;

            const username = $('authUsername').value.trim();
            const password = $('authPassword').value;

            try {
                // Ditangkap auth.js lalu diteruskan ke /api?a=login atau /api?a=register
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, action: currentMode })
                });
                const data = await res.json();

                if (data.success) {
                    alert(data.message || 'Berhasil!');
                    closeModal('authModal');
                    $('authPassword').value = '';
                    showLoggedIn(data.user.username);
                } else {
                    alert('Gagal: ' + data.message);
                }
            } catch (err) {
                console.error('Auth error:', err);
                alert('Terjadi kesalahan jaringan atau server: ' + (err && err.message ? err.message : err));
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        restoreSession();
    </script>

    <!-- WAJIB: memuat auth.js (jembatan login ke /api?a=login & /api?a=register) -->
    <script src="auth.js" defer></script>
</body>
</html>
