<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bitworld (BTW) - Web3 dApp</title>
  <style>
    :root {
      --bg: #09070d;
      --fg: #e2e1e5;
      --muted: #6a64a0;
      --accent: #f5b02a;
      --accent2: #22d3ee;
      --card: rgba(18, 14, 28, 0.72);
      --line: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow-x: hidden; background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    
    header { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(9, 7, 13, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
    .brand { font-weight: 800; font-size: 18px; color: var(--accent); display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .btn { padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; transition: all 0.2s ease; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    .btn-primary { background: var(--accent); color: #1a1400; }
    .btn-primary:active { transform: scale(0.96); }
    .user-badge { font-size: 12px; padding: 6px 12px; background: rgba(34, 211, 238, 0.1); border: 1px solid var(--accent2); color: var(--accent2); border-radius: 20px; display: none; }

    main { flex: 1; padding: 24px 16px; max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 20px; }
    
    .hero { text-align: center; margin-top: 10px; }
    .hero h1 { font-size: 32px; font-weight: 900; margin-bottom: 8px; }
    .hero p { color: var(--muted); font-size: 14px; line-height: 1.5; }
    
    .badge { display: inline-block; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 11px; color: var(--accent2); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px; text-align: center; }
    .card .label { font-size: 10px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .card .value { font-size: 14px; font-weight: 800; color: var(--accent); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(6px); }
    .modal-card { background: #120e1c; border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .modal-card h2 { font-size: 20px; margin-bottom: 16px; color: var(--accent); }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .form-group input { width: 100%; padding: 10px 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions .btn { flex: 1; }
    .btn-close { background: transparent; border: 1px solid var(--line); color: var(--muted); }

    .actions { display: flex; gap: 10px; justify-content: center; }
    .btn-outline { background: transparent; border: 1px solid var(--line); color: var(--fg); }
  </style>
</head>
<body>

  <header>
    <a href="#" class="brand">
      <span>Bitworld</span>
    </a>
    <div class="nav-actions">
      <span id="userBadge" class="user-badge">Akun Aktif</span>
      <button id="authBtn" type="button" class="btn btn-primary" onclick="toggleAuthModal()">Masuk</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="badge">BEP-20 • BNB Smart Chain</div>
      <h1>Bitworld</h1>
      <p>Proyek Layer 2 di jaringan BSC dengan token BTW. Pelajari visi, whitepaper, dan kontrak Bitworld.</p>
    </section>

    <div class="stats">
      <div class="card">
        <div class="label">Simbol</div>
        <div class="value">BTW</div>
      </div>
      <div class="card">
        <div class="label">Supply</div>
        <div class="value">21.000.000</div>
      </div>
      <div class="card">
        <div class="label">Jaringan</div>
        <div class="value">BSC</div>
      </div>
    </div>

    <div class="actions">
      <a href="whitepaper-bitworld-btw-publik-v1.html" class="btn btn-primary">Baca Whitepaper</a>
      <a href="#" class="btn btn-outline" onclick="alert('Kontrak: 0x...')">Lihat Kontrak</a>
    </div>
  </main>

  <div id="loginModal" class="modal-overlay">
    <div class="modal-card">
      <h2>Masuk Bitworld</h2>
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required placeholder="••••••••">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-close" onclick="toggleAuthModal(false)">Batal</button>
          <button type="submit" class="btn btn-primary">Masuk</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    function toggleAuthModal(show = true) {
      const modal = document.getElementById('loginModal');
      if (modal) {
        modal.style.display = show ? 'flex' : 'none';
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      checkSessionStatus();
    });

    function checkSessionStatus() {
      const token = localStorage.getItem('bw_token') || localStorage.getItem('token');
      const user = localStorage.getItem('bw_user') || localStorage.getItem('user');

      const authBtn = document.getElementById('authBtn');
      const userBadge = document.getElementById('userBadge');

      if (token && user) {
        try {
          const userData = JSON.parse(user);
          if (authBtn) {
            authBtn.innerText = "Keluar";
            authBtn.onclick = handleLogout;
          }
          if (userBadge) {
            userBadge.innerText = userData.email || "Akun Aktif";
            userBadge.style.display = "inline-block";
          }
        } catch (e) {
          console.error("Session parse error", e);
        }
      } else {
        if (authBtn) {
          authBtn.innerText = "Masuk";
          authBtn.onclick = () => toggleAuthModal(true);
        }
        if (userBadge) {
          userBadge.style.display = "none";
        }
      }
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        alert("Harap isi Email dan Password!");
        return;
      }

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && (data.success || data.ok || data.token)) {
          const token = data.token || data.access_token;
          const user = data.user || data.data || { email: email };

          localStorage.setItem('bw_token', token);
          localStorage.setItem('token', token);
          localStorage.setItem('bw_user', JSON.stringify(user));
          localStorage.setItem('user', JSON.stringify(user));

          toggleAuthModal(false);
          checkSessionStatus();
          alert("Login Berhasil!");
        } else {
          alert(data.message || "Gagal masuk. Periksa email dan password.");
        }
      } catch (err) {
        console.error("Login fetch error:", err);
        alert("Terjadi kesalahan koneksi ke server.");
      }
    }

    function handleLogout() {
      if (confirm("Apakah Anda yakin ingin keluar?")) {
        localStorage.removeItem('bw_token');
        localStorage.removeItem('token');
        localStorage.removeItem('bw_user');
        localStorage.removeItem('user');
        window.location.reload();
      }
    }
  </script>
</body>
</html>
