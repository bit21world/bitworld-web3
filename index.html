<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitworld Web3 dApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header / Navbar -->
    <header class="w-full max-w-4xl flex justify-between items-center py-4 border-b border-slate-800 mb-8">
        <h1 class="text-2xl font-bold text-amber-400">Bitworld</h1>
        <div id="authHeader">
            <button onclick="openModal('loginModal')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg transition">
                Login / Daftar
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-4xl text-center space-y-6">
        <h2 class="text-4xl font-extrabold text-amber-400">Bitworld</h2>
        <p class="text-slate-400 max-w-lg mx-auto">
            Proyek Layer-2 di jaringan BSC dengan ekosistem Web3 dan integrasi modul KYC aman.
        </p>

        <!-- Dynamic User Status Card -->
        <div id="userCard" class="hidden bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-md mx-auto text-left space-y-4">
            <div class="flex justify-between items-center">
                <span class="text-slate-400">Selamat datang,</span>
                <span id="displayUsername" class="font-bold text-amber-400 text-lg"></span>
            </div>
            <div class="flex justify-between items-center border-t border-slate-700 pt-3">
                <span class="text-slate-400">Status KYC:</span>
                <span id="displayKycStatus" class="px-3 py-1 rounded-full text-xs font-bold bg-yellow-500/20 text-yellow-400 border border-yellow-500/30">
                    Belum Verifikasi
                </span>
            </div>
            <button onclick="openModal('kycModal')" id="btnKycForm" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-xl transition mt-2">
                Isi Formulir KYC
            </button>
        </div>
    </main>

    <!-- MODAL LOGIN / REGISTER -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 relative space-y-4">
            <button onclick="closeModal('loginModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white">&times;</button>
            <h3 class="text-xl font-bold text-amber-400">Masuk / Daftar Akun</h3>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Username</label>
                    <input type="text" id="loginUsername" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
                </div>
                <button type="submit" id="btnLoginSubmit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition">
                    Masuk
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL KYC -->
    <div id="kycModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 relative space-y-4 max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal('kycModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white">&times;</button>
            <h3 class="text-xl font-bold text-amber-400">Verifikasi Identitas (KYC)</h3>
            <form id="kycForm" onsubmit="handleKycSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Lengkap</label>
                    <input type="text" id="kycFullName" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nomor KTP / Paspor</label>
                    <input type="text" id="kycDocNumber" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">URL Foto Dokumen Identity</label>
                    <input type="text" id="kycDocImage" placeholder="https://..." required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">URL Foto Selfie</label>
                    <input type="text" id="kycSelfieImage" placeholder="https://..." required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-400">
                </div>
                <button type="submit" id="btnKycSubmit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition">
                    Kirim Verifikasi
                </button>
            </form>
        </div>
    </div>

    <script>
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLoginSubmit');
            btn.innerText = 'Memproses...';
            btn.disabled = true;

            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const res = await fetch('/api/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    alert(data.message || 'Login Berhasil!');
                    closeModal('loginModal');
                    document.getElementById('userCard').classList.remove('hidden');
                    document.getElementById('displayUsername').innerText = data.user.username;
                    document.getElementById('authHeader').innerHTML = `<span class="text-amber-400 font-bold">${data.user.username}</span>`;
                } else {
                    alert('Gagal Login: ' + data.message);
                }
            } catch (err) {
                alert('Terjadi kesalahan jaringan atau server');
            } finally {
                btn.innerText = 'Masuk';
                btn.disabled = false;
            }
        }

        async function handleKycSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('btnKycSubmit');
            btn.innerText = 'Mengirim...';
            btn.disabled = true;

            const body = {
                fullName: document.getElementById('kycFullName').value,
                docNumber: document.getElementById('kycDocNumber').value,
                docImage: document.getElementById('kycDocImage').value,
                selfieImage: document.getElementById('kycSelfieImage').value
            };

            try {
                const res = await fetch('/api/kyc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();

                if (data.success) {
                    alert('Verifikasi KYC berhasil dikirim!');
                    closeModal('kycModal');
                    document.getElementById('displayKycStatus').innerText = 'PENDING';
                } else {
                    alert('Gagal mengirim KYC: ' + data.message);
                }
            } catch (err) {
                alert('Terjadi kesalahan jaringan saat mengirim KYC');
            } finally {
                btn.innerText = 'Kirim Verifikasi';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
