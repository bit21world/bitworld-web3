<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Bitworld (BTW) - animasi</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="75%">
      <stop offset="0" stop-color="#2f5bd8"/><stop offset="0.55" stop-color="#14337f"/><stop offset="1" stop-color="#061940"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="192">
      <stop offset="0" stop-color="#fff0b0"/><stop offset="0.5" stop-color="#f7c53a"/><stop offset="1" stop-color="#d48a0c"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/><stop offset="0.45" stop-color="#f5b82e"/><stop offset="1" stop-color="#c77d08"/>
    </linearGradient>
    <radialGradient id="globe" cx="40%" cy="32%" r="80%">
      <stop offset="0" stop-color="#2a56c9"/><stop offset="1" stop-color="#0a2263"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a5f3fc"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <circle cx="128" cy="128" r="126" fill="#051537"/>
  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="114" fill="none" stroke="url(#goldRing)" stroke-width="10"/>
  <circle cx="128" cy="128" r="105" fill="none" stroke="#fff0b0" stroke-opacity="0.35" stroke-width="2"/>

  <!-- orbit belakang globe + titik yang sedang di belakang -->
  <g transform="rotate(-24 128 128)">
    <ellipse cx="128" cy="128" rx="94" ry="29" fill="none" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="7"/>
    <g>
      <circle r="13" fill="#051537"/><circle r="9" fill="#67e8f9"/>
      <animateMotion dur="6s" repeatCount="indefinite" path="M34,128 A94,29 0 1 1 222,128 A94,29 0 1 1 34,128"/>
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- globe berputar -->
  <circle cx="128" cy="128" r="60" fill="url(#globe)"/>
  <g fill="none" stroke="url(#gold)" stroke-width="7.5" stroke-linecap="round">
    <circle cx="128" cy="128" r="60"/>
    <line x1="68" y1="128" x2="188" y2="128"/>
    <path d="M78 98 H178"/>
    <path d="M78 158 H178"/>
    <ellipse cx="128" cy="128" rx="0" ry="60">
      <animate attributeName="rx" values="0;60;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="128" cy="128" rx="0" ry="60">
      <animate attributeName="rx" values="0;60;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="6s" begin="-2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="128" cy="128" rx="0" ry="60">
      <animate attributeName="rx" values="0;60;0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" dur="6s" begin="-4s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- orbit depan globe + titik yang sedang di depan -->
  <g transform="rotate(-24 128 128)">
    <path d="M34 128 A94 29 0 0 0 222 128" fill="none" stroke="url(#cyan)" stroke-width="9" stroke-linecap="round"/>
    <g opacity="0">
      <circle r="15" fill="#051537"/><circle r="11" fill="#a5f3fc"/><circle cx="-3" cy="-4" r="4" fill="#ffffff" fill-opacity="0.9"/>
      <animateMotion dur="6s" repeatCount="indefinite" path="M34,128 A94,29 0 1 1 222,128 A94,29 0 1 1 34,128"/>
      <animate attributeName="opacity" values="0;1" keyTimes="0;0.5" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    </g>
  </g>

  <ellipse cx="128" cy="62" rx="82" ry="40" fill="url(#shine)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
