<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06163a">
<title>Project Info &amp; Official Links - BITWORLD21 (BTW)</title>
<style>
:root{--bg:#06163a;--fg:#eaf1ff;--muted:#9db3dc;--accent:#f5b82e;--card:#0d2459;--line:rgba(147,197,253,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06163a radial-gradient(ellipse at 50% -10%,#1d4ed8 0%,#0b2a6b 45%,#06163a 100%) fixed;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.65;padding:0 0 40px}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:rgba(6,22,58,.95);border-bottom:1px solid var(--line)}
header a.back{color:var(--accent);text-decoration:none;font-weight:700;font-size:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
.lang button.on{background:#12306e;color:#fff}
main{max-width:720px;margin:0 auto;padding:18px 16px}
h1{font-size:26px;letter-spacing:-.5px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.toc a{border:1px solid var(--line);color:var(--muted);text-decoration:none;border-radius:999px;padding:5px 11px;font-size:12px}
.toc a:active{color:var(--accent);border-color:var(--accent)}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;scroll-margin-top:70px}
section h2{font-size:18px;color:var(--accent);margin-bottom:8px}
section p{font-size:14px;opacity:.93;margin-bottom:8px}
section p:last-child{margin-bottom:0}
section ul,section ol{padding-left:20px;font-size:14px;opacity:.93;margin-bottom:8px}
section li{margin-bottom:6px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#bcd2ff;word-break:break-all;background:#0a2150;border:1px solid var(--line);padding:8px;border-radius:8px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
td:first-child{color:var(--muted);width:38%}
.alloc{margin-top:6px}
.alloc .row{margin-bottom:10px}
.alloc .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:4px}
.alloc .bar{height:8px;border-radius:999px;background:#0a2150;overflow:hidden}
.alloc .bar i{display:block;height:100%;border-radius:999px}
.links a.card{display:block;text-decoration:none;color:var(--fg);background:#0a2150;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.links a.card b{color:var(--accent);font-size:14px}
.links a.card span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.links a.card:active{border-color:var(--accent)}
.member{display:flex;gap:14px;align-items:center;margin-top:10px;background:#0a2150;border:1px solid var(--line);border-radius:14px;padding:14px}
.av{width:72px;height:72px;border-radius:50%;flex:none;overflow:hidden;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;background:#12306e;font-weight:800;font-size:28px;color:var(--accent)}
.av img{width:100%;height:100%;object-fit:cover}
.mi{min-width:0}
.tag{display:inline-block;font-size:10px;letter-spacing:1px;font-weight:800;padding:3px 9px;border-radius:999px;background:rgba(245,184,46,.14);color:var(--accent)}
.member h3{font-size:16px;margin:6px 0 2px}
.member .nm{font-weight:700;font-size:14px}
.member p{font-size:12.5px;margin:6px 0 0}
.pills a{display:inline-block;margin:6px 8px 0 0;font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;padding:4px 10px;border-radius:999px;background:rgba(245,184,46,.12)}
.btn{display:inline-block;margin:6px 6px 0 0;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid rgba(147,197,253,.30);color:var(--fg);background:transparent;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#3b2a00}
.foot{text-align:center;margin-top:18px}
.pages{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:18px}
.pages a{border:1px solid var(--line);color:var(--muted);text-decoration:none;border-radius:999px;padding:6px 12px;font-size:12.5px}
.pages a.cur{border-color:rgba(245,184,46,.5);color:var(--accent);background:rgba(245,184,46,.1)}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(100px);background:#fff;color:#000;padding:8px 16px;border-radius:10px;font-size:13px;transition:transform .4s,opacity .4s;z-index:9;white-space:nowrap;opacity:0;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<header>
  <a class="back" href="/" id="back"></a>
  <div class="lang" role="group" aria-label="Language">
    <button id="l-en" type="button">EN</button>
    <button id="l-id" type="button">ID</button>
  </div>
</header>
<main>
  <h1 id="h1"></h1>
  <p class="sub" id="sub"></p>
  <nav class="toc" id="toc"></nav>
  <div id="content"></div>
  <nav class="pages" id="pages" aria-label="Pages"></nav>
</main>
<div id="toast"></div>
<script>
var CONTRACT = "0x05931E2821D7ab52e845E54380f13500f4B70Ea9";
var BSCSCAN = "https://bscscan.com/token/" + CONTRACT;
var CUR = "info";
var lang = "en";
try { if (localStorage.getItem("btw_lang") === "id") lang = "id"; } catch (e) {}

var UI = {
  en: {pdf:"Download PDF", back:"← BITWORLD21", copy:"Copy Address", copied:"Address copied", copyfail:"Copy failed", bsc:"Open BscScan", wp:"Whitepaper", token:"Token", team:"Team", info:"Project info"},
  id: {pdf:"Unduh PDF", back:"← BITWORLD21", copy:"Salin Alamat", copied:"Alamat disalin", copyfail:"Gagal menyalin", bsc:"Buka BscScan", wp:"Whitepaper", token:"Token", team:"Tim", info:"Info proyek"}
};
var PAGES = [["wp","/whitepaper.html"],["token","/token.html"],["team","/team.html"],["info","/info.html"]];

var PAGE = {
  title: {en:"Project Info & Official Links", id:"Info Proyek & Tautan Resmi"},
  sub: {en:"BITWORLD21 (BTW) • Channels, FAQ, news, and roadmap", id:"BITWORLD21 (BTW) • Kanal, FAQ, berita, dan roadmap"}
};
var SECTIONS = [
  {t:{en:"Official Links",id:"Tautan Resmi"},
   b:{en:["Official information only comes from these channels. Be wary of accounts that contact you first."],
      id:["Informasi resmi hanya dari kanal berikut. Waspadai akun yang menghubungi Anda lebih dulu."]},
   links:[
     {n:{en:"Website"}, u:"https://bitworld21.com", d:{en:"Whitepaper, tokenomics, and contract",id:"Whitepaper, tokenomics, dan kontrak"}},
     {n:{en:"X (Twitter)"}, u:"https://x.com/bitworld_btw", d:{en:"Short announcements",id:"Pengumuman singkat"}},
     {n:{en:"Facebook"}, u:"https://www.facebook.com/share/1FKuR8i7rT/", d:{en:"Official BITWORLD21 page",id:"Halaman resmi BITWORLD21"}},
     {n:{en:"Telegram"}, u:"https://t.me/Bitworld_Official", d:{en:"Official announcements and discussion",id:"Pengumuman dan diskusi resmi"}},
     {n:{en:"LinkedIn"}, u:"https://www.linkedin.com/in/juandri-juan-2b5602449", d:{en:"Official LinkedIn profile",id:"Profil LinkedIn resmi"}},
     {n:{en:"BscScan"}, u:"https://bscscan.com/token/0x05931E2821D7ab52e845E54380f13500f4B70Ea9", d:{en:"Verify the official token contract",id:"Verifikasi kontrak token resmi"}}
   ]},
  {t:{en:"About the Project",id:"Tentang Proyek"},
   b:{en:["BTW is a BEP-20 token on BNB Smart Chain for the BITWORLD21 ecosystem.","This is not investment advice. Do your own research and only use funds you can afford to risk."],
      id:["BTW adalah token BEP-20 di BNB Smart Chain untuk ekosistem BITWORLD21.","Ini bukan nasihat investasi. Lakukan riset sendiri dan hanya gunakan dana yang siap Anda risikokan."]}},
  {t:{en:"News & Announcements",id:"Berita & Pengumuman"},
   table:{
     en:[["12 Nov 2026","BTW now shows live market data on Binance Wallet (snapshot 12:25 UTC+8): 117 holders, market cap about $16.9K. Liquidity is still very small (under $300), so the price can move sharply on small trades. Not financial advice."],
         ["11 Nov 2026","A BTW/USDT liquidity pool was opened on PancakeSwap (BNB Smart Chain), so BTW can now be traded on a DEX."],
         ["Nov 2026","BscScan now shows the BITWORLD21 logo, verified tick, and official links on the token page."],
         ["20 Oct 2026","BITWORLD21 (BTW) website and public whitepaper released."]],
     id:[["12 Nov 2026","BTW kini tampil dengan data pasar di Binance Wallet (snapshot 12.25 WITA): 117 holder, market cap sekitar $16,9K. Likuiditas masih sangat kecil (di bawah $300), sehingga harga bisa bergerak tajam pada transaksi kecil. Bukan nasihat keuangan."],
         ["11 Nov 2026","Pool likuiditas BTW/USDT dibuka di PancakeSwap (BNB Smart Chain), sehingga BTW kini bisa diperdagangkan di DEX."],
         ["Nov 2026","BscScan kini menampilkan logo BITWORLD21, centang verified, dan tautan resmi di halaman token."],
         ["20 Okt 2026","Website BITWORLD21 (BTW) dan whitepaper versi publik dirilis."]]}},
  {t:{en:"FAQ",id:"FAQ"},
   table:{
     en:[["What is BTW?","BTW is a BEP-20 token on BNB Smart Chain for the BITWORLD21 ecosystem."],
         ["Is there an airdrop?","BTW is distributed through daily mining and tasks, taken from the Community Pool and recorded in your account. Connect your MetaMask wallet in the Profile menu. Information about withdrawing to your wallet, and any separate airdrop, is announced only through the project's official channels."],
         ["How do I verify the contract?","Match the address on this page with BscScan before interacting with anything."],
         ["Where can I trade BTW?","A BTW/USDT pool exists on PancakeSwap. Liquidity is still very small, so prices can swing a lot and trades may slip. Always confirm the contract address on BscScan and never trust a link sent to you in a private message."],
         ["Is this investment advice?","No. Do your own research and only use funds you can afford to risk."]],
     id:[["Apa itu BTW?","BTW adalah token BEP-20 di BNB Smart Chain untuk ekosistem BITWORLD21."],
         ["Apakah ada airdrop?","BTW dibagikan lewat mining harian dan tugas, diambil dari Pool Komunitas dan tercatat di akun Anda. Hubungkan wallet MetaMask di menu Profil. Info penarikan ke wallet dan airdrop terpisah (jika ada) hanya diumumkan lewat kanal resmi proyek."],
         ["Bagaimana cara memverifikasi kontrak?","Cocokkan alamat di halaman ini dengan BscScan sebelum berinteraksi apa pun."],
         ["Di mana saya bisa memperdagangkan BTW?","Pool BTW/USDT tersedia di PancakeSwap. Likuiditas masih sangat kecil, sehingga harga bisa bergerak tajam dan transaksi bisa mengalami slippage. Selalu pastikan alamat kontrak di BscScan dan jangan percaya tautan yang dikirim lewat pesan pribadi."],
         ["Apakah ini nasihat investasi?","Tidak. Lakukan riset sendiri dan hanya gunakan dana yang siap Anda risikokan."]]}},
  {t:{en:"Roadmap",id:"Roadmap"},
   b:{en:["General plan. Dates have not been set and may change."],
      id:["Rencana umum. Tanggal belum ditetapkan dan dapat berubah."]},
   list:{en:["Phase 1, Foundation: token, contract, and public documentation.","Phase 2, Growth: application development and ecosystem partnerships.","Phase 3, Sustainability: stronger governance and long-term utility."],
         id:["Fase 1, Fondasi: token, kontrak, dan dokumentasi publik.","Fase 2, Pertumbuhan: pengembangan aplikasi dan kemitraan ekosistem.","Fase 3, Keberlanjutan: penguatan tata kelola dan utilitas jangka panjang."]}},
  {t:{en:"Privacy",id:"Privasi"},
   b:{en:["To create an account, we ask for your name, email, and password. If you use identity verification (KYC) or connect a wallet, the data you submit is also stored to provide the service.","Account data is stored in a managed database (Neon). Your browser stores your login status, referral code, and language choice. We also record anonymous visit counts through Vercel Web Analytics.","We never ask for your seed phrase or private key."],
      id:["Untuk membuat akun, kami meminta nama, email, dan password. Jika Anda memakai fitur verifikasi identitas (KYC) atau menghubungkan wallet, data yang Anda kirim juga kami simpan untuk keperluan layanan.","Data akun disimpan di database terkelola (Neon). Browser Anda menyimpan status login, kode referral, dan bahasa pilihan. Kami juga mencatat jumlah kunjungan anonim melalui Vercel Web Analytics.","Kami tidak pernah meminta seed phrase atau private key."]}}
];


function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function toast(m){ var t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("show"); }, 1600); }
function copyText(text){
  function legacy(){
    var ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
    var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove(); toast(ok ? UI[lang].copied : UI[lang].copyfail);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast(UI[lang].copied); }, legacy);
  else legacy();
}

function render(){
  var u = UI[lang];
  document.documentElement.lang = lang;
  document.title = PAGE.title[lang] + " - BITWORLD21 (BTW)";
  document.getElementById("l-en").classList.toggle("on", lang === "en");
  document.getElementById("l-id").classList.toggle("on", lang === "id");
  document.getElementById("back").textContent = u.back;
  document.getElementById("h1").textContent = PAGE.title[lang];
  document.getElementById("sub").textContent = PAGE.sub[lang];
  var toc = "", html = "";
  SECTIONS.forEach(function(s, i){
    toc += '<a href="#s' + i + '">' + esc(s.t[lang]) + '</a>';
    html += '<section id="s' + i + '"><h2>' + (i + 1) + '. ' + esc(s.t[lang]) + '</h2>';
    (s.b ? s.b[lang] : []).forEach(function(p){ html += "<p>" + esc(p) + "</p>"; });
    if (s.table) {
      html += "<table>" + s.table[lang].map(function(r){ return "<tr><td>" + esc(r[0]) + "</td><td>" + esc(r[1]) + "</td></tr>"; }).join("") + "</table>";
    }
    if (s.alloc) {
      html += '<div class="alloc">' + s.alloc.map(function(a){
        return '<div class="row"><div class="top"><span>' + esc(a.n[lang]) + '</span><b>' + a.p + '%</b></div><div class="bar"><i style="width:' + a.p + '%;background:' + a.c + '"></i></div></div>';
      }).join("") + "</div>";
    }
    if (s.list) {
      var tag = s.ordered ? "ol" : "ul";
      html += "<" + tag + ">" + s.list[lang].map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + "</" + tag + ">";
    }
    if (s.members) {
      html += s.members.map(function(m){
        var ph = /^(https:\/\/|\/)[^\s"'<>]+$/i.test(m.photo || "") ? m.photo : "";
        var ini = esc(m.name.charAt(0).toUpperCase());
        var av = ph ? '<div class="av"><img src="' + esc(ph) + '" alt="' + esc(m.name) + '" data-ini="' + ini + '"></div>' : '<div class="av">' + ini + '</div>';
        var pills = "";
        [["LinkedIn", m.links.linkedin], ["X", m.links.x], ["GitHub", m.links.github]].forEach(function(it){
          if (/^https:\/\/[^\s"'<>]+$/i.test(it[1] || "")) pills += '<a href="' + esc(it[1]) + '" target="_blank" rel="noopener noreferrer">' + it[0] + '</a>';
        });
        return '<div class="member">' + av + '<div class="mi"><span class="tag">' + esc(m.tag) + '</span><h3>' + esc(m.role[lang]) + '</h3><div class="nm">' + esc(m.name) + '</div><p>' + esc(m.desc[lang]) + '</p><div class="pills">' + pills + '</div></div></div>';
      }).join("");
    }
    if (s.links) {
      html += '<div class="links">' + s.links.map(function(l){
        var ext = /^https?:/.test(l.u);
        return '<a class="card" href="' + esc(l.u) + '"' + (ext ? ' target="_blank" rel="noopener noreferrer"' : '') + '><b>' + esc(l.n[lang] || l.n.en) + '</b><span>' + esc(l.d[lang]) + '</span></a>';
      }).join("") + "</div>";
    }
    if (s.code) html += '<div class="mono">' + esc(CONTRACT) + "</div>";
    if (s.actions) {
      html += '<button class="btn primary" type="button" data-copy="1">' + esc(u.copy) + '</button>' +
        '<a class="btn" href="' + BSCSCAN + '" target="_blank" rel="noopener noreferrer">' + esc(u.bsc) + '</a>';
    }
    html += "</section>";
  });
  if (PAGE.pdf) html += '<div class="foot"><a class="btn" href="/whitepaper-bitworld-btw-publik-v2.pdf" download>' + esc(u.pdf) + '</a></div>';
  document.getElementById("toc").innerHTML = toc;
  document.getElementById("content").innerHTML = html;
  document.getElementById("pages").innerHTML = PAGES.map(function(p){
    return '<a href="' + p[1] + '"' + (p[0] === CUR ? ' class="cur"' : '') + '>' + esc(u[p[0]]) + '</a>';
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".av img"), function(im){
    im.addEventListener("error", function(){ im.parentNode.textContent = im.getAttribute("data-ini") || ""; });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-copy]"), function(b){ b.onclick = function(){ copyText(CONTRACT); }; });
}
function setLang(l){ lang = l; try { localStorage.setItem("btw_lang", l); } catch (e) {} render(); }
document.getElementById("l-en").onclick = function(){ setLang("en"); };
document.getElementById("l-id").onclick = function(){ setLang("id"); };
render();
</script>
</body>
</html>
