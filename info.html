<!DOCTYPE html>

<style>
:root{--bg:#f4f5fb;--card:#fff;--ink:#14163a;--mut:#6a6e92;--pri:#5a4fe0;--gold:#b88a00;--line:#e4e6f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0e14;--card:#151a26;--ink:#eef0ff;--mut:#9ba0c4;--pri:#8f86ff;--gold:#f0c23a;--line:#262c40}}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:24px;margin:0}h2{font-size:17px;margin:0 0 10px}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--gold);border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
p{margin:0 0 8px}.mut{color:var(--mut);font-size:14px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}dt{color:var(--mut)}dd{margin:0;word-break:break-all;text-align:right}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 4px;border-top:1px solid var(--line);text-align:left}th{color:var(--mut);font-weight:600;border-top:0}td:nth-child(n+2),th:nth-child(n+2){text-align:right}
.scroll{overflow-x:auto}
a{color:var(--pri);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:8px}.links a{border:1px solid var(--line);border-radius:99px;padding:8px 14px;text-decoration:none;background:var(--card)}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}.lang button{font:inherit;font-size:13px;font-weight:700;border:0;padding:6px 12px;background:transparent;color:var(--mut);cursor:pointer}.lang button.on{background:var(--pri);color:#fff}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.note{font-size:13px;color:var(--mut);margin-top:18px;border-left:3px solid var(--gold);padding-left:10px}
</style>
</head>
<body>
